name: Build wgcf for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build wgcf
        run: |
          cd cmd/wgcf
          go build -o wgcf.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wgcf-windows
          path: cmd/wgcf/wgcf.exe
